<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 70" width="100%" height="100%">
  <defs>
    <linearGradient id="omGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Smartphone Outline -->
  <rect x="3" y="4" width="44" height="62" rx="10" fill="url(#phoneGrad)" stroke="#334155" stroke-width="2" />
